<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blagues pour Élodie 🍬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow-x:hidden;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f4f1ea] flex items-center justify-center p-4 sm:p-6 overflow-y-auto">

    <!-- Carte Principale : Style épuré, tons sauge et crème -->
    <div class="bg-[#ffffff] rounded-[24px] shadow-sm max-w-2xl w-full p-6 sm:p-10 text-center border border-[#e0ddd5] relative z-10 my-8">

        <h1 class="text-3xl sm:text-4xl font-serif font-medium text-[#4a5d4e] mb-4">
            Blagues pour Élodie
        </h1>

        <p class="text-[#8c887d] mb-8 text-base sm:text-lg italic font-light">
            Une petite dose de sourire pour ta journée.
        </p>

        <!-- Zone de texte : Fond neutre et doux -->
        <div class="bg-[#faf9f6] rounded-2xl p-6 sm:p-12 min-h-[200px] flex items-center justify-center border border-[#efede8]">
            <p id="joke" class="text-lg sm:text-xl font-medium text-[#5a564d] leading-relaxed"></p>
        </div>

        <!-- Bouton : Couleur Sauge/Eucalyptus, sobre -->
        <button onclick="generateJoke()"
            class="mt-10 px-8 py-3 rounded-lg bg-[#6b8572] hover:bg-[#5a7260] transition-colors duration-300 text-white text-lg font-medium shadow-sm active:transform active:scale-95">
            Nouvelle blague
        </button>

    </div>

    <script>
        const jokes = [
            "Pourquoi les plongeurs plongent-ils toujours en arrière et jamais en avant ? Parce que sinon ils tombent dans le bateau.",
            "Que dit une imprimante dans l’eau ? J’ai papier !",
            "Pourquoi les canards ont-ils autant de plumes ? Pour couvrir leur derrière.",
            "Que fait un crocodile quand il rencontre une femelle ? Il Lacoste.",
            "Pourquoi les squelettes ne se battent jamais ? Ils n’ont pas le cran.",
            "Quel est le comble pour un électricien ? Ne pas être au courant."
        ];

        function generateJoke() {
            const jokeElement = document.getElementById('joke');
            // Petit effet de fondu simple
            jokeElement.style.opacity = 0;
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * jokes.length);
                jokeElement.textContent = jokes[randomIndex];
                jokeElement.style.opacity = 1;
            }, 150);
        }

        // Animation de transition CSS simple
        document.getElementById('joke').style.transition = "opacity 0.2s ease-in-out";

        generateJoke();
    </script>

</body>
</html>
